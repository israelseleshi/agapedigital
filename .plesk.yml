version: 1.0

build:
  commands:
    - echo "Starting build process..."
    - npm ci --only=production
    - npm run build
    - echo "Build completed!"

deploy:
  commands:
    - echo "Starting deployment..."
    - cp -r dist/* ./
    - echo "Files copied to root directory"
    - ls -la
    - echo "Deployment completed!"

hooks:
  postDeploy:
    - echo "Setting up Node.js application..."
    - echo "Current directory contents:"
    - ls -la
    - echo "Application should be live now!"

settings:
  nodejs:
    version: "22"
    startFile: "server.js"
    applicationRoot: "/"
    applicationMode: "production"
    env:
      NODE_ENV: "production"
